<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F0F0F" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <title>BharatTube</title>
    <meta name="description" content="BharatTube — video streaming and sharing platform." />
    <meta name="application-name" content="BharatTube" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BharatTube" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="shortcut icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <script>
      // Next.js inlines process.env.NEXT_PUBLIC_* at build time; provide the
      // same values in the browser (from .env.example).
      window.process = window.process || { env: {} };
      window.process.env = Object.assign(
        { NODE_ENV: "production", NEXT_PUBLIC_API_URL: "https://bharattube-ylmq.onrender.com/api/v1" },
        window.process.env || {}
      );
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-[#0F0F0F] text-zinc-900 dark:text-[#F1F1F1] antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
